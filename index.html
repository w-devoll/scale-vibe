<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- FAVICON CONFIGURATION -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- iOS Home Screen Icons -->
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="favicon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
    
    <!-- iOS Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Weights">
    
    <title>Weights</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --forest-deep: #344e41;
            --fern: #588157;
            --moss: #a3b18a;
            --tea-green: #ccd5aeff;
            --beige: #e9edc9ff;
            --cornsilk: #fefae0ff;
            --papaya-whip: #faedcdff;
            --light-bronze: #d4a373ff;
            
            --primary: var(--light-bronze);
            --card: var(--papaya-whip);
            --text-main: #4a4439;
            --text-sub: #7a7366;
            --danger: #e07a5f;
            --accent: #9ba37e;
            --success: #588157;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* Ensure green covers entire area including safe areas */
        html {
            background-color: var(--forest-deep);
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Urbanist', sans-serif;
            /* Background gradient that fills everything */
            background: radial-gradient(circle at 50% 40%, var(--fern) 0%, #436742 40%, var(--forest-deep) 85%, #283b31 100%);
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            flex-direction: column; 
            align-items: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #lockScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--forest-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .pin-container {
            width: 100%;
            max-width: 300px;
            text-align: center;
            color: var(--cornsilk);
        }

        #pinInput {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--moss);
            border-radius: 12px;
            color: white;
            font-size: 32px;
            text-align: center;
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            letter-spacing: 10px;
            -webkit-text-security: disc;
        }

        .container { 
            width: 100%; 
            max-width: 440px; 
            display: none; 
            padding: 20px 16px; 
        }

        header { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; padding: 10px 4px; }

        h1, .chart-title, .input-header, .stat-label, .trend-header {
            font-family: 'Akaya Kanadaka', system-ui;
            margin: 0;
            font-weight: 400;
        }

        h1 {
            font-size: 48px;
            letter-spacing: -0.5px;
            color: var(--cornsilk);
            text-align: center;
            line-height: 1.1;
            text-shadow: 1px 1px 0px var(--fern), 2px 2px 0px var(--fern), 4px 4px 0px var(--forest-deep), 8px 8px 20px rgba(0,0,0,0.3);
        }

        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
        }

        .input-header, .trend-header { font-size: 26px; color: var(--text-main); margin-bottom: 16px; display: block; }
        #trendsWrapper { display: none; }
        .trends-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .trend-stat-box {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 10px; background: rgba(212, 163, 115, 0.08); border-radius: 20px;
        }

        .stat-label { font-size: 18px; color: var(--text-sub); margin-bottom: 4px; }
        .stat-value { font-size: 26px; font-weight: 900; color: var(--text-main); }
        .trend-up { color: var(--danger); }
        .trend-down { color: var(--success); }

        .input-section { display: flex; flex-direction: column; align-items: center; gap: 16px; }

        input[type=number] {
            font-family: 'Urbanist', sans-serif;
            width: 100%; padding: 18px; border: 2px solid var(--beige); border-radius: 18px;
            font-size: 26px; font-weight: 700; text-align: center; outline: none;
            color: var(--text-main); background: rgba(254, 250, 224, 0.6);
        }

        input:focus { border-color: var(--primary); background: #fff; }

        button.primary-btn {
            font-family: 'Urbanist', sans-serif;
            width: 140px; padding: 12px; background: var(--primary); color: white;
            border: none; border-radius: 16px; font-size: 18px; font-weight: 800;
            cursor: pointer; text-transform: lowercase; box-shadow: 0 4px 12px rgba(212, 163, 115, 0.3);
        }

        #status { font-size: 16px; color: var(--text-sub); text-align: center; margin-top: 12px; height: 18px; font-family: 'Akaya Kanadaka', system-ui; }

        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .chart-title { font-size: 24px; color: var(--text-main); }

        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(212, 163, 115, 0.15); }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-weight: 600; color: var(--text-sub); font-size: 15px; }
        .history-val { font-weight: 800; font-size: 18px; color: var(--text-main); }
        
        .delete-icon-btn { background: none; border: none; color: var(--danger); cursor: pointer; padding: 4px 8px; font-size: 22px; opacity: 0.6; }
        .action-btn { background: none; border: none; color: var(--text-sub); cursor: pointer; padding: 4px; font-family: 'Akaya Kanadaka', system-ui; font-size: 16px; }
        .action-btn.success { color: var(--success); }

        .chart-legend {
            display: flex; gap: 12px; margin-top: 14px; font-size: 13px; font-weight: 700;
            color: var(--text-sub); justify-content: center;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>

<div id="lockScreen">
    <div class="pin-container">
        <h1 style="font-size: 32px; text-shadow: none; margin-bottom: 10px;">Weights</h1>
        <p style="font-family: 'Akaya Kanadaka'; font-size: 18px; opacity: 0.8;">Enter PIN to unlock</p>
        <input type="password" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••">
        <button class="primary-btn" onclick="checkPin()" style="width: 100%; margin-top: 10px;">Good morning!</button>
        <div id="pinError" style="color: var(--danger); margin-top: 15px; font-family: 'Akaya Kanadaka'; min-height: 20px;"></div>
    </div>
</div>

<div class="container" id="mainApp">
    <header>
        <h1>Observe your weight</h1>
    </header>

    <div class="card">
        <span class="input-header">Log today's number</span>
        <div class="input-section">
            <div class="input-group" style="width: 100%;">
                <input type="number" id="weightInput" step="0.1" pattern="\d*" placeholder="00.0" inputmode="decimal">
            </div>
            <button class="primary-btn" onclick="addEntry()">Whoosh it!</button>
        </div>
        <div id="status"></div>
    </div>

    <div class="card" id="trendsWrapper">
        <span class="trend-header">Trend</span>
        <div class="trends-grid">
            <div class="trend-stat-box">
                <span class="stat-label">30 days</span>
                <span id="stat30d" class="stat-value">--</span>
            </div>
            <div class="trend-stat-box">
                <span class="stat-label">60 days</span>
                <span id="stat60d" class="stat-value">--</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="chart-header">
            <span class="chart-title">How it's going</span>
        </div>
        <div style="height: 240px; position: relative;">
            <canvas id="weightChart"></canvas>
        </div>
        <div class="chart-legend">
            <div class="legend-item"><span class="dot" style="background: var(--accent);"></span> 7-day median</div>
            <div class="legend-item"><span class="dot" style="background: var(--cornsilk); border: 1.5px solid var(--primary);"></span> logged weight</div>
        </div>
    </div>

    <div class="card">
        <div class="chart-header">
            <span class="chart-title">History</span>
            <div style="display:flex; gap: 12px;">
                <button class="action-btn success" id="syncBtn" onclick="syncFromCloud()">Sync</button>
                <button class="action-btn danger" onclick="clearHistory()" title="Clear All">Clear</button>
            </div>
        </div>
        <div id="historyContainer"></div>
    </div>
</div>

<script>
    const APP_PIN = "8765";
    const ENCODED_URL = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J5MGgtVjBiRFo1TnFyd1dWd0QtQm9XdVNUdk0wMngwSWdfMkVBaHQ5aXp5NVhORjdXdmNIbmo1NVZCY0YzVUxnbUR6QS9leGVj";
    const GOOGLE_SCRIPT_URL = ENCODED_URL ? atob(ENCODED_URL) : "";
    const MAX_WEIGHT = 300;
    const MIN_WEIGHT = 40;

    let weightData = JSON.parse(localStorage.getItem('vibe_weights_v1')) || [];
    let myChart = null;

    function checkPin() {
        const input = document.getElementById('pinInput');
        const error = document.getElementById('pinError');
        if (input.value === APP_PIN) {
            document.getElementById('lockScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                updateUI();
            }, 300);
        } else {
            error.innerText = "Incorrect PIN";
            input.value = "";
            input.focus();
            setTimeout(() => { error.innerText = ""; }, 2000);
        }
    }

    document.getElementById('pinInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkPin();
    });

    function updateUI() {
        calculateTrends();
        renderChart();
        renderHistory();
    }

    function getMedianForRange(weights) {
        if (weights.length === 0) return null;
        const sorted = [...weights].sort((a, b) => a - b);
        const lowMiddle = Math.floor((sorted.length - 1) / 2);
        const highMiddle = Math.ceil((sorted.length - 1) / 2);
        return (sorted[lowMiddle] + sorted[highMiddle]) / 2;
    }

    function calculateTrends() {
        const trendsWrapper = document.getElementById('trendsWrapper');
        if (weightData.length < 5) {
            trendsWrapper.style.display = 'none';
            return;
        }

        const chrono = [...weightData].reverse();
        const currentWindow = chrono.slice(-7).map(d => d.weight);
        const currentMedian = getMedianForRange(currentWindow);

        const periods = [30, 60];
        periods.forEach(p => {
            const el = document.getElementById(`stat${p}d`);
            const target = Math.max(0, chrono.length - p);
            const window = chrono.slice(Math.max(0, target - 6), target + 1).map(d => d.weight);
            const refMedian = getMedianForRange(window);
            const diff = currentMedian - refMedian;
            el.innerText = (diff > 0 ? '+' : '') + diff.toFixed(1);
            el.className = 'stat-value ' + (diff > 0 ? 'trend-up' : (diff < 0 ? 'trend-down' : ''));
        });

        trendsWrapper.style.display = 'block';
    }

    async function addEntry() {
        const input = document.getElementById('weightInput');
        const status = document.getElementById('status');
        const val = parseFloat(input.value);

        if (isNaN(val) || val < MIN_WEIGHT || val > MAX_WEIGHT) {
            status.innerText = "Invalid weight";
            return;
        }

        status.innerText = "Saving...";
        const now = new Date();
        const dateStr = now.toLocaleDateString(); 
        
        const newEntry = { 
            id: Date.now(),
            date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), 
            fullDate: now.toISOString(),
            weight: val 
        };

        weightData.unshift(newEntry);
        localStorage.setItem('vibe_weights_v1', JSON.stringify(weightData));
        
        if (GOOGLE_SCRIPT_URL) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    date: dateStr,
                    weight: val
                })
            }).catch(e => console.error("Post failed", e));
        }

        updateUI();
        input.value = '';
        input.blur();
        status.innerText = "Logged";
        setTimeout(() => { status.innerText = ""; }, 3000);
    }

    async function syncFromCloud() {
        if (!GOOGLE_SCRIPT_URL) return;

        const btn = document.getElementById('syncBtn');
        const status = document.getElementById('status');
        btn.innerText = "...";
        btn.disabled = true;
        status.innerText = "Syncing...";

        try {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const rawData = await response.json();
            const rows = Array.isArray(rawData) ? rawData : (rawData.data || rawData.values || []);
            
            if (!rows.length) {
                status.innerText = "No data found";
                return;
            }

            const cloudEntries = [];
            rows.forEach(row => {
                if (!row) return;
                let weight = null;
                let dateObj = null;

                const cells = Array.isArray(row) ? row : Object.values(row);
                
                cells.forEach(cell => {
                    if (cell === "" || cell === null) return;
                    
                    const clean = String(cell).replace(/[a-zA-Z\s,]/g, '');
                    const num = parseFloat(clean);
                    if (weight === null && !isNaN(num) && num > MIN_WEIGHT && num < MAX_WEIGHT) {
                        weight = num;
                    } 
                    else if (dateObj === null) {
                        const d = new Date(cell);
                        if (!isNaN(d.getTime()) && d.getFullYear() > 2000) {
                            dateObj = d;
                        }
                    }
                });

                if (weight !== null && dateObj !== null) {
                    cloudEntries.push({
                        id: dateObj.getTime() + Math.random(),
                        fullDate: dateObj.toISOString(),
                        date: dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
                        weight: weight
                    });
                }
            });

            if (cloudEntries.length === 0) {
                status.innerText = "No valid entries";
            } else {
                const merged = [...weightData];
                cloudEntries.forEach(c => {
                    const day = c.fullDate.split('T')[0];
                    const exists = merged.some(l => l.fullDate.split('T')[0] === day && Math.abs(l.weight - c.weight) < 0.1);
                    if (!exists) merged.push(c);
                });

                merged.sort((a, b) => new Date(b.fullDate) - new Date(a.fullDate));
                weightData = merged;
                localStorage.setItem('vibe_weights_v1', JSON.stringify(weightData));
                updateUI();
                status.innerText = `Synced ${cloudEntries.length} items`;
            }
        } catch (e) {
            status.innerText = "Sync failed";
        } finally {
            btn.innerText = "sync";
            btn.disabled = false;
            setTimeout(() => { status.innerText = ""; }, 3000);
        }
    }

    function renderChart() {
        const ctx = document.getElementById('weightChart').getContext('2d');
        const displayData = [...weightData].slice(0, 30).reverse();
        if (myChart) myChart.destroy();
        if (!displayData.length) return;

        const rollingMedians = displayData.map(item => {
            const chrono = weightData.slice().reverse();
            const idx = chrono.findIndex(i => i.fullDate === item.fullDate);
            const window = chrono.slice(Math.max(0, idx - 6), idx + 1).map(d => d.weight);
            return getMedianForRange(window);
        });

        myChart = new Chart(ctx, {
            data: {
                labels: displayData.map(d => d.date),
                datasets: [
                    { type: 'line', data: rollingMedians, borderColor: '#9ba37e', backgroundColor: 'transparent', borderWidth: 4, tension: 0.4, pointRadius: 0 },
                    { type: 'scatter', data: displayData.map(d => d.weight), backgroundColor: '#fefae0', borderColor: '#d4a373', borderWidth: 2.5, pointRadius: 4 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        grid: { color: 'rgba(204, 213, 174, 0.15)' }, 
                        ticks: { 
                            color: '#7a7366', 
                            font: { family: 'Urbanist', weight: '700' },
                            maxTicksLimit: 5 
                        } 
                    },
                    x: { 
                        grid: { display: false }, 
                        ticks: { 
                            color: '#7a7366', 
                            font: { family: 'Urbanist', weight: '700' },
                            maxRotation: 45,
                            minRotation: 45,
                            autoSkip: true,
                            maxTicksLimit: 4 
                        } 
                    }
                }
            }
        });
    }

    function renderHistory() {
        const container = document.getElementById('historyContainer');
        if (!weightData.length) {
            container.innerHTML = `<div style="text-align:center; padding: 20px; color:var(--text-sub); font-size:14px;">No data</div>`;
            return;
        }
        let html = '<ul class="history-list">';
        weightData.slice(0, 5).forEach(item => {
            html += `<li class="history-item"><span class="history-date">${item.date}</span><div style="display:flex; align-items:center; gap:8px;"><span class="history-val">${item.weight}</span><button class="delete-icon-btn" onclick="deleteEntry('${item.fullDate}')">&times;</button></div></li>`;
        });
        container.innerHTML = html + '</ul>';
    }

    function deleteEntry(fullDate) {
        weightData = weightData.filter(item => item.fullDate !== fullDate);
        localStorage.setItem('vibe_weights_v1', JSON.stringify(weightData));
        updateUI();
    }

    function clearHistory() {
        if (confirm("Clear all?")) {
            weightData = [];
            localStorage.setItem('vibe_weights_v1', JSON.stringify(weightData));
            updateUI();
        }
    }
</script>
</body>
</html>
